name: Backend CI

on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1) Checkout du code
      - uses: actions/checkout@v4

      # 2) Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3) Installation des dépendances
      - name: Install dependencies
        run: npm install
        working-directory: backend

      - name: Fix Vitest permissions
        run: chmod +x node_modules/.bin/vitest
        working-directory: backend

      # 4) Lancement des tests Vitest
      - name: Run tests
        run: npx vitest run
        working-directory: backend

      # 5) Connexion à GHCR
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 6) Build + Push de l’image Docker (uniquement si tests OK)
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/gallobaidy/applicesi/backend:latest
