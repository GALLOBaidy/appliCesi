name: Backoffice CI

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/backoffice/**"
      - ".github/workflows/backoffice-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: gallobaidy
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend/backoffice
          push: true
          tags: ghcr.io/gallobaidy/applicesi/backoffice:latest
